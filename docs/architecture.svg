<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 856" width="880" height="856" role="img" aria-labelledby="title desc">
<title id="title">fints-client components</title>
<desc id="desc">Your application calls the crate fints-client and gets a Step back. Inside the crate: jobs, banks, protocol, formats, codec, session, quirks, transport, mask, trace and the derive crate. Below it, a bank or the offline test bank.</desc>
<style>
.t{font:700 17px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#1c2126}
.d{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5d6670}
.a{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5d6670}
.l{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5d6670;letter-spacing:1.2px}
</style>
<rect width="880" height="856" rx="12" fill="#f6f4ef"/>
<rect x="20" y="20" width="840" height="78" rx="10" fill="#ebe8e0" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="38" y="54" class="t">your application</text>
<text x="38" y="76" class="d">UI, storage, product ID, timers</text>
<rect x="20" y="142" width="840" height="572" rx="14" fill="none" stroke="#cfc9bb" stroke-width="1.5" stroke-dasharray="6 5"/><text x="38" y="170" class="l">CRATE FINTS-CLIENT</text>
<text x="440.0" y="125" class="a" text-anchor="middle">▼ calls · ▲ gets a Step&lt;T&gt; back</text>
<rect x="38.0" y="186" width="395.0" height="94" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="56.0" y="218" class="t">jobs</text>
<text x="56.0" y="241" class="d">operations as steps: open, balance,</text>
<text x="56.0" y="260" class="d">transactions, transfer</text>
<rect x="447.0" y="186" width="395.0" height="94" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="465.0" y="228" class="t">banks</text>
<text x="465.0" y="250" class="d">bank directory and profiles, as data</text>
<rect x="38.0" y="294" width="395.0" height="94" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="56.0" y="326" class="t">protocol</text>
<text x="56.0" y="349" class="d">dialog, BPD/UPD, version negotiation,</text>
<text x="56.0" y="368" class="d">TAN engine, return codes</text>
<rect x="447.0" y="294" width="395.0" height="94" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="465.0" y="326" class="t">formats</text>
<text x="465.0" y="349" class="d">MT940, camt.052, MT535/536,</text>
<text x="465.0" y="368" class="d">pain.001/002</text>
<rect x="38.0" y="402" width="395.0" height="94" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="56.0" y="434" class="t">codec</text>
<text x="56.0" y="457" class="d">declarative segments, generic parse</text>
<text x="56.0" y="476" class="d">and serialise</text>
<rect x="447.0" y="402" width="395.0" height="94" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="465.0" y="434" class="t">session</text>
<text x="465.0" y="457" class="d">SessionState, PausedDialog: values</text>
<text x="465.0" y="476" class="d">the caller stores</text>
<rect x="38.0" y="510" width="258.6666666666667" height="94" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="56.0" y="542" class="t">quirks</text>
<text x="56.0" y="565" class="d">repairs for malformed</text>
<text x="56.0" y="584" class="d">bank messages</text>
<rect x="310.6666666666667" y="510" width="258.6666666666667" height="94" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="328.6666666666667" y="542" class="t">transport</text>
<text x="328.6666666666667" y="565" class="d">the one exchange boundary;</text>
<text x="328.6666666666667" y="584" class="d">HTTPS behind feature http</text>
<rect x="583.3333333333334" y="510" width="258.6666666666667" height="94" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="601.3333333333334" y="542" class="t">mask</text>
<text x="601.3333333333334" y="565" class="d">no secrets in logs</text>
<text x="601.3333333333334" y="584" class="d">or traces</text>
<rect x="38.0" y="618" width="395.0" height="78" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="56.0" y="652" class="t">trace</text>
<text x="56.0" y="674" class="d">feature trace: Recorder and masked Trace</text>
<rect x="447.0" y="618" width="395.0" height="78" rx="10" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="465.0" y="652" class="t">fints-client-derive</text>
<text x="465.0" y="674" class="d">proc-macro crate: #[derive(Segment)]</text>
<text x="440.0" y="741" class="a" text-anchor="middle">▼ FinTS message over HTTPS ▲</text>
<rect x="20" y="758" width="413.0" height="78" rx="10" fill="#ebe8e0" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="38" y="792" class="t">bank</text>
<text x="38" y="814" class="d">a FinTS 3.0 PIN/TAN server</text>
<rect x="447.0" y="758" width="413.0" height="78" rx="10" fill="#ebe8e0" stroke="#d9d4c8" stroke-width="1.5"/>
<text x="465.0" y="792" class="t">fints-client-testbank</text>
<text x="465.0" y="814" class="d">synthetic bank and trace replay, offline</text>
</svg>
