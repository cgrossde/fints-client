# Publishes docs/architecture.html as the project's GitHub Pages site.
# Needs Settings > Pages > Source set to "GitHub Actions" once.
name: Pages

on:
  push:
    branches: [main]
    paths: [docs/architecture.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pages of a private repository needs a paid plan; publish once the
    # repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: mkdir _site && cp docs/architecture.html _site/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # What actions/upload-pages-artifact does, inlined: it calls
      # actions/upload-artifact by tag, which the repository's rule that
      # every action is pinned to a commit SHA refuses.
      - run: tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  # A job of its own, as in GitHub's Pages template: within the uploading
  # job the artifact is not yet listed when deploy-pages looks for it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
