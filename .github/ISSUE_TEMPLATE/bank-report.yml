name: Bank report
description: Tell us how fints-client did at your bank, whether the run worked or failed.
title: "Bank report: <bank name> (<BLZ>)"
labels: ["bank report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying fints-client at your bank. Run `scripts/try-bank.sh <BLZ>` ([docs/adding-a-bank.md](https://github.com/cgrossde/fints-client/blob/main/docs/adding-a-bank.md)) and fill in what it printed. A failed run is as welcome as a clean one.

        Never post your PIN, a TAN or your user ID. The script does not print them, and the summary table and the trace do not hold them.
  - type: input
    id: bank
    attributes:
      label: Bank name
      placeholder: Sparkasse KölnBonn
    validations:
      required: true
  - type: input
    id: blz
    attributes:
      label: BLZ
      description: The 8-digit bank code you ran the script with (characters 5 to 12 of your IBAN).
      placeholder: "37050198"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date of the run
      placeholder: "2026-11-20"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary table
      description: The table the script printed (from "Summary of the trace:" on). It holds no name, account number, amount or booking text. Print it again with `cargo run -q --features trace --example trace_summary -- testbank/fixtures/replay/local/<bank>-<BLZ>.trace.json`.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: worked
    attributes:
      label: What worked
      options:
        - label: Login
        - label: Balances
        - label: Transactions
        - label: Depot holdings
        - label: The offline replay ("replays clean")
  - type: dropdown
    id: tan
    attributes:
      label: How the bank asked for confirmation
      options:
        - Approval in the banking app
        - A typed TAN (photoTAN, chipTAN, SMS, ...)
        - It did not ask
        - The run did not get that far
  - type: textarea
    id: notes
    attributes:
      label: What did not work, and anything else you noticed
      description: For example an account that is missing, a job that failed, a kind of account we should know about (credit card, depot, savings).
  - type: textarea
    id: trace
    attributes:
      label: Trace file (optional, and welcome)
      description: |
        Drag `testbank/fixtures/replay/local/<bank>-<BLZ>.trace.json` (or `<bank>-<BLZ>.failed-<time>.json`) into this field. With it we can replay your bank offline and keep it working.

        The trace holds the messages of the run with the bank's parameters, versions and return codes. Your PIN, TAN, user ID, name, account numbers, IBANs, counterparties, booking texts and amounts are replaced before the file is written. It still shows how many accounts of which kind you have and how many bookings of which kind, with all dates moved by the same few days.
